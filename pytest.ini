```ini
[pytest]
minversion = 8.0

testpaths =
    tests

pythonpath =
    src

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --showlocals
    --cov=fraction
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=95

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

xfail_strict = true

junit_family = xunit2

log_cli = false

console_output_style = progress

cache_dir = .pytest_cache
```
