[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraction-py"
version = "1.0.2"
description = "A modern, lightweight, pure-Python Fraction data type with rich arithmetic, comparison, conversion, and interoperability support."
readme = "README.md"
requires-python = ">=3.12"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Shravan Kumar Pandey" }
]

maintainers = [
    { name = "Shravan Kumar Pandey" }
]

keywords = [
    "fraction",
    "rational",
    "math",
    "numbers",
    "datatype",
    "python",
    "fractions",
    "numeric"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Mathematics"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "build>=1.2",
    "coverage[toml]>=7.6",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "twine>=5.1"
]

[project.urls]
Homepage = "https://github.com/Shravan4598/fraction"
Repository = "https://github.com/Shravan4598/fraction"
Issues = "https://github.com/Shravan4598/fraction/issues"
Documentation = "https://shravan4598.github.io/fraction"
Changelog = "https://github.com/Shravan4598/fraction/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraction*"]

[tool.setuptools.package-data]
fraction = ["py.typed"]

# --------------------------------------------------
# Black
# --------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py312"]

# --------------------------------------------------
# Ruff
# --------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4"
]

ignore = []

# --------------------------------------------------
# MyPy
# --------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true

# --------------------------------------------------
# Pytest
# --------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "--showlocals",
    "--cov=fraction",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=95"
]

xfail_strict = true

filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

# --------------------------------------------------
# Coverage
# --------------------------------------------------

[tool.coverage.run]
source = ["fraction"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95