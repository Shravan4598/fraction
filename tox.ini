```ini
[tox]
minversion = 4.18
envlist =
    py310
    py311
    py312
    py313
    lint
    type
    build

isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the test suite
package = wheel

deps =
    -rrequirements-dev.txt

commands =
    pytest

[testenv:lint]
description = Run Ruff linter

deps =
    -rrequirements-dev.txt

commands =
    ruff check src tests examples

[testenv:format]
description = Check Black formatting

deps =
    -rrequirements-dev.txt

commands =
    black --check src tests examples

[testenv:type]
description = Run MyPy type checking

deps =
    -rrequirements-dev.txt

commands =
    mypy src

[testenv:build]
description = Build source and wheel distributions

deps =
    build

commands =
    python -m build

[testenv:docs]
description = Build project documentation

deps =
    -rrequirements-dev.txt

commands =
    mkdocs build

[testenv:coverage]
description = Run tests with coverage

deps =
    -rrequirements-dev.txt

commands =
    pytest --cov=fraction --cov-report=term-missing --cov-report=html --cov-report=xml

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
```
