[metadata]
license_files = LICENSE

[options]
zip_safe = False
include_package_data = True

[flake8]
max-line-length = 88
extend-ignore =
    E203,
    W503
exclude =
    .git,
    .venv,
    .tox,
    __pycache__,
    build,
    dist,
    .mypy_cache,
    .pytest_cache

[isort]
profile = black
line_length = 88
combine_as_imports = True
skip_gitignore = True

[coverage:run]
branch = True
source =
    fraction

[coverage:report]
show_missing = True
skip_covered = False
precision = 2
fail_under = 95
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    raise NotImplementedError
    pass

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

[bdist_wheel]
universal = 0

[egg_info]
tag_build =
tag_date = 0